<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <link rel= "stylesheet" href="style.css">
    <script src="script.js"></script>
    <title>
        DApp
    </title>
</head>

<body>
    
    <div id="title">
        SUBSCRIPTION BASED DECENTRALIZED ACCESS APP
    </div>

    <div class="ACCESS_CONTROLS1">

        <div id="SUB">
            Would you like to add this to your subscription.If yess kindly hit the subscribe button 
            <button id="SUB1">Subscribe</button>
            Thank you so much for subscribing
        </div>

        <div id="Access-CHECKER">
            <label for="Access check">Check Whether You Have Access To The subscription<br>(ACCESS_SUB)</br</label>
            <input type="text"  placeholder="Enter your wallet address">
            <button  id="ACCESS_SUB1"  type="text">Submit Wallet Address</button>
        </div>

        <DIV ID="FAD">
            <label for = "FEES & DURATION">Update FEES and DURATION of the course<br>(Only for OWNER)</br> </label>
            <input type="text"  placeholder="Enter new">
            <input type="text"  placeholder="Enter new duration">
            <button  id="ACCESS_FAD"  type="text">Submit</button>
        </DIV>
    </div>

    <div class= "ACCESS_CONTROL2">
        <div id="Check_Fees">
            Check latest FEES for the subscription 
            <button id="C_F1">Check</button>
        </div>

        <div id="Check_Duration">
            Check the duration for the subscription 
            <button id="C_D1">Check</button>
        </div>

        <div id="Check_Expiry">
            Check expiry for the subscription 
            <input type="text"  placeholder="Enter your address">
            <button id="C_E1">Submit</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="app.js"></script>
</body>
